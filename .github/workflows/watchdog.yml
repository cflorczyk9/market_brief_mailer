name: Brief Watchdog

# Verifies the daily brief actually sent. Fires AFTER the last daily-brief
# window (09:37 UTC / 09:37 EDT) so a slow real send isn't false-flagged.
#
# If the brief did not send, the watchdog emails Connor and dispatches the
# main workflow one more time using the auto-injected GITHUB_TOKEN (NOT the
# external PAT, so this still works even when the external trigger's credential
# has expired). The main script's noon-ET bail still gates whether the late
# attempt actually delivers, so both windows below sit before noon ET.

on:
  schedule:
    # Two staggered odd-minute windows after the last daily-brief window
    # (13:37 UTC). Avoid :00/:30 (GitHub drops those hardest). Both land
    # before noon ET in EDT and EST so a re-dispatch can still deliver.
    - cron: "13 14 * * 1-5"  # 10:13 EDT / 09:13 EST
    - cron: "47 14 * * 1-5"  # 10:47 EDT / 09:47 EST
  workflow_dispatch: {}

# actions: write lets the watchdog script POST workflow_dispatch back to
# daily-brief.yml using the auto-injected GITHUB_TOKEN (no PAT required).
permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watchdog
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watchdog.py
