name: Daily Market Brief

on:
  schedule:
    # Target: 7:00am ET every weekday the US market is open.
    # GitHub cron is fixed UTC and can't follow DST, and scheduled runs are
    # routinely delayed 30min-3h (or dropped). So we fire several times across
    # the 7-9am ET window covering BOTH EDT (UTC-4) and EST (UTC-5). The script
    # gates on real ET time (never sends before 7am ET) and uses a Supabase
    # dedup guard so only the first run that lands in the window actually sends.
    - cron: "0 11 * * 1-5"   # 7:00am EDT (summer) primary
    - cron: "20 11 * * 1-5"  # EDT backup
    - cron: "50 11 * * 1-5"  # EDT backup
    - cron: "0 12 * * 1-5"   # 7:00am EST (winter) primary / 8:00am EDT backup
    - cron: "30 12 * * 1-5"  # backup
    - cron: "0 13 * * 1-5"   # last-resort catch-up
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send only to Connor (test mode)"
        type: boolean
        default: true

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance
      - name: Generate and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}
          SUBSCRIBE_URL: ${{ secrets.SUBSCRIBE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python generate_and_send.py --test
          else
            python generate_and_send.py
          fi
