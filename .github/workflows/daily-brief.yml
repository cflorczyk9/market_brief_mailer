name: Daily Market Brief

on:
  schedule:
    # PRIMARY trigger is external (cron-job.org) calling workflow_dispatch at
    # 5:30 AM ET weekdays. GitHub Actions schedule: is unreliable (5-7 hour
    # drift, sometimes dropped entirely on low-activity repos), so it is used
    # only as a backup if the external service is down. The script holds the
    # send until 6:00 AM ET no matter when it starts; Supabase dedup ensures
    # only one run actually sends.
    - cron: "30 9 * * 1-5"   # 5:30 AM EDT backup
    - cron: "30 10 * * 1-5"  # 5:30 AM EST / 6:30 AM EDT backup
    - cron: "30 11 * * 1-5"  # 6:30 AM EST / 7:30 AM EDT last-resort
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send only to Connor (test mode)"
        type: boolean
        default: true

# Serialize all runs of this workflow. GitHub batches delayed scheduled runs,
# so two backup crons can otherwise fire seconds apart and both pass the
# "already sent today?" check before either records the send. With one run at a
# time, the second waits, then sees the brief is already archived and no-ops.
concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "yfinance==1.4.1"
      - name: Generate and send
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}
          SUBSCRIBE_URL: ${{ secrets.SUBSCRIBE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python generate_and_send.py --test
          else
            python generate_and_send.py
          fi
