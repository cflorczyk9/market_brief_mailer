name: Daily Market Brief

on:
  schedule:
    # An external trigger (cron-job.org) calling workflow_dispatch is meant to
    # deliver on-time at 6:30 AM ET. It depends on a GitHub PAT that can expire
    # silently, so GitHub's own schedule is the reliable floor here, not a
    # mere backup. GitHub drops scheduled runs most often at :00 and :30 (peak
    # congestion) and on busy weekday mornings, so these windows are staggered
    # across odd minutes and a wide span. The script holds the send until
    # 6:30 AM ET no matter when a run starts, and Supabase dedup means every
    # firing after the first is a harmless no-op. Window spans 09:37-13:37 UTC
    # to cover ~5:30 AM ET (EDT and EST) through well before the noon-ET bail.
    - cron: "37 9 * * 1-5"   # 05:37 EDT / 04:37 EST
    - cron: "23 10 * * 1-5"  # 06:23 EDT / 05:23 EST
    - cron: "47 10 * * 1-5"  # 06:47 EDT / 05:47 EST
    - cron: "19 11 * * 1-5"  # 07:19 EDT / 06:19 EST
    - cron: "43 11 * * 1-5"  # 07:43 EDT / 06:43 EST
    - cron: "17 12 * * 1-5"  # 08:17 EDT / 07:17 EST
    - cron: "53 12 * * 1-5"  # 08:53 EDT / 07:53 EST
    - cron: "37 13 * * 1-5"  # 09:37 EDT / 08:37 EST last-resort
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send only to Connor (test mode)"
        type: boolean
        default: true

# Serialize all runs of this workflow. GitHub batches delayed scheduled runs,
# so two backup crons can otherwise fire seconds apart and both pass the
# "already sent today?" check before either records the send. With one run at a
# time, the second waits, then sees the brief is already archived and no-ops.
concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-brief:
    runs-on: ubuntu-latest
    # Generous enough that a run which starts before 6:30 ET can hold until the
    # 6:30 send window without the runner being killed mid-sleep.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "yfinance==1.4.1"
      - name: Generate and send
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}
          SUBSCRIBE_URL: ${{ secrets.SUBSCRIBE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python generate_and_send.py --test
          else
            python generate_and_send.py
          fi
