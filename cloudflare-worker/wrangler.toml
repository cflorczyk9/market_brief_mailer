name = "market-brief-trigger"
main = "src/index.js"
compatibility_date = "2026-06-03"

# Cloudflare cron triggers are UTC-only. Two primary crons cover DST:
#   "30 9  * * 1-5" → 5:30 EDT (summer)
#   "30 10 * * 1-5" → 5:30 EST (winter) / 6:30 EDT (summer; harmless dedup)
#   "0  12 * * 1-5" → 8:00 EDT / 7:00 EST (watchdog, after primary window)
#
# Free plan allows up to 5 cron triggers per Worker; we use 3.
[triggers]
crons = [
  "30 9 * * 1-5",
  "30 10 * * 1-5",
  "0 12 * * 1-5",
]

# Observability: stream logs to dashboard / `wrangler tail`. Free.
[observability]
enabled = true
